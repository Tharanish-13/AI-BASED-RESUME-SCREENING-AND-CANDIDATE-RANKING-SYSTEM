version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ai_resume_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: .
    container_name: ai_resume_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
